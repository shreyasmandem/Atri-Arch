[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aip"
version = "0.1.0"
description = "Architect Intelligence Platform - explainable multi-agent AI for architectural design"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Every dependency here is free and open source. There are no paid SDKs:
# all model access goes through free-tier HTTP APIs or local inference.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "shapely>=2.0.6",
    "scikit-learn>=1.5",
    "trimesh>=4.5",
    "pillow>=10.4",
    "jinja2>=3.1",
    "rank-bm25>=0.2.2",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Local CPU embeddings. Falls back to a deterministic hashing embedder when absent,
# so the platform runs with zero extra downloads if you want it to.
embeddings = ["fastembed>=0.4", "onnxruntime>=1.19"]
# PDF report rendering for Vastu / cost deliverables.
reports = ["reportlab>=4.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
]

[project.scripts]
aip = "aip.cli:main"

[tool.setuptools.packages.find]
include = ["aip*"]

[tool.setuptools.package-data]
aip = ["knowledge/*.yaml", "knowledge/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
